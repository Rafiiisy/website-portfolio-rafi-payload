<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio CMS</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
      main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
      .panel { background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
      .row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      label { display: grid; gap: 6px; font-size: 14px; }
      input, textarea, select, button {
        width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155;
        background: #1f2937; color: inherit; font-size: 14px;
      }
      textarea { min-height: 120px; font-family: Consolas, monospace; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .actions button { width: auto; cursor: pointer; }
      #status { white-space: pre-wrap; min-height: 80px; background: #020617; border-radius: 8px; padding: 10px; border: 1px solid #334155; }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Salon Mastery Studio</h1>
        <p>Edit pages and save directly to <code>content/pages/*.json</code>.</p>
      </section>

      <section class="panel">
        <h2>Site Settings</h2>
        <div class="row">
          <label>Brand
            <input id="siteBrand" type="text" />
          </label>
          <label>Footer text
            <input id="siteFooterText" type="text" />
          </label>
        </div>
        <div class="actions">
          <button id="saveSiteBtn" type="button">Save Site</button>
        </div>
      </section>

      <section class="panel">
        <h2>Pages</h2>
        <div class="actions">
          <select id="pageSelect"></select>
          <button id="newPageBtn" type="button">New Page</button>
          <button id="refreshBtn" type="button">Refresh</button>
        </div>
        <div class="row">
          <label>Title
            <input id="pageTitle" type="text" />
          </label>
          <label>Slug
            <input id="pageSlug" type="text" />
          </label>
        </div>
        <div class="row">
          <label>SEO title
            <input id="seoTitle" type="text" />
          </label>
          <label>SEO description
            <input id="seoDescription" type="text" />
          </label>
        </div>
        <label>Sections JSON
          <textarea id="sectionsJson"></textarea>
        </label>
        <div class="actions">
          <button id="validateBtn" type="button">Validate</button>
          <button id="savePageBtn" type="button">Save Page</button>
        </div>
      </section>

      <pre id="status"></pre>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
