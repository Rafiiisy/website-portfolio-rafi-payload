services:
  payloadcms:
    profiles: ["production"]
    build: .
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    environment:
      NODE_ENV: production
      DATABASE_URI: ${DATABASE_URI}
      # DATABASE_URI: mongodb://${DOCKER_MONGO_DB_USERNAME}:${DOCKER_MONGO_DB_PASSWORD}@mongo:27017/${DOCKER_MONGO_DB_NAME}?authSource=adminadmin
    env_file:
      - ./.env
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.${DOCKER_PROJECT_NAME}-payloadcms.rule=${DOCKER_PAYLOADCMS_HOST}
      - traefik.http.routers.${DOCKER_PROJECT_NAME}-payloadcms.entrypoints=websecure
      - traefik.http.routers.${DOCKER_PROJECT_NAME}-payloadcms.tls=true
      - traefik.http.routers.${DOCKER_PROJECT_NAME}-payloadcms.tls.certresolver=letsencrypt
      - traefik.http.services.${DOCKER_PROJECT_NAME}-payloadcms.loadbalancer.server.port=3000
    networks:
      - proxy
      - backend
    depends_on:
      - mongo

  mongo:
    image: mongo:${DOCKER_MONGO_DB_VERSION}
    restart: unless-stopped
    volumes:
      - ./mongo-data/data:/data/db
      - ./mongo-data/init:/docker-entrypoint-initdb.d
    networks:
      - backend
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DOCKER_MONGO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DOCKER_MONGO_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DOCKER_MONGO_DB_NAME}
    ports:
      - "27017:27017"

  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=hello@rafisyafrinaldi.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    external: true
  backend:
    driver: bridge
